name: Parser regression checks

on:
  push:
    branches: [main, ai-parser-v6, ai-self-learning-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m py_compile core.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check learning.js
      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v
