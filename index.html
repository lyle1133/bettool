<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="押注统计">
<meta name="theme-color" content="#0e1014">
<title>押注自动统计</title>
<style>
:root{
  --bg:#0e1014; --card:#171a21; --card2:#1f242e; --btn:#232833;
  --accent:#3b8cf5; --text:#eef0f3; --muted:#8890a0;
  --yellow:#ffd158; --green:#59d97a; --red:#f26666;
  --border:#2a2f3a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%;overflow:hidden;
}
body{
  display:flex;flex-direction:column;height:100dvh;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
header{
  flex-shrink:0;padding:10px 12px;background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
header h1{font-size:16px;font-weight:600}
#status{font-size:12px;color:var(--muted);flex:1;text-align:right}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.tab{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:none;
  flex-direction:column;gap:10px;padding:12px;
  -webkit-overflow-scrolling:touch;
}
.tab.active{display:flex}
#tab-input > * { flex-shrink: 0; }

textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:14px 14px;border-radius:10px;font-size:16px;
  font-family:inherit;resize:vertical;outline:none;
  min-height:52px;line-height:1.4;
}
textarea:focus,input:focus{border-color:var(--accent)}
select{padding:10px 12px;min-height:44px}

#raw-input{ min-height:120px; font-size:16px; }
#preview-box{
  background:var(--card2);border-radius:10px;padding:14px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;
  white-space:pre-wrap;min-height:60px;max-height:180px;overflow:auto;
  line-height:1.5;
}
#ai-status{
  background:var(--card2);border-radius:10px;padding:10px 12px;
  color:var(--muted);font-size:13px;line-height:1.4;
}

.btn-row{display:flex;gap:8px;flex-wrap:wrap}
button{
  background:var(--btn);color:var(--text);border:none;
  padding:14px 16px;border-radius:10px;font-size:16px;
  font-family:inherit;cursor:pointer;flex:1;min-width:0;
  white-space:nowrap;min-height:48px;
  font-weight:500;
}
button:active{opacity:0.7}
button.primary{background:var(--accent);font-weight:600}
button.danger{background:#5a1e1e}

#totals{font-size:14px;color:var(--yellow);padding:6px 2px;line-height:1.6}

.user-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:4px 0;
}
.user-bar > span{
  font-size:13px;color:var(--muted);margin-right:4px;flex-shrink:0;
}
.user-bar button{
  flex:0 0 auto;min-width:44px;min-height:40px;
  padding:8px 12px;font-size:14px;
  background:var(--card);border:1px solid var(--border);
}
.user-bar button.active{
  background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;
}

.records-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 2px;
}
.records-header h3{font-size:14px;font-weight:600;color:var(--muted)}
.records-header .count{
  font-size:12px;color:var(--accent);font-weight:600;
  background:rgba(59,140,245,0.12);
  padding:2px 8px;border-radius:10px;
}

#records-list{
  background:var(--card);border-radius:10px;
  border:1px solid var(--border);
}
#records-list .rec-row{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--border);
  font-size:14px;
}
#records-list .rec-row:last-child{border-bottom:none}
#records-list .rec-row .user{
  color:#fff;font-weight:600;font-size:12px;
  padding:2px 7px;border-radius:4px;flex-shrink:0;
  background:#888;
}
#records-list .rec-row .user[data-u="A"]{background:#3b8cf5}
#records-list .rec-row .user[data-u="B"]{background:#59d97a;color:#0e1014}
#records-list .rec-row .user[data-u="C"]{background:#ffd158;color:#0e1014}
#records-list .rec-row .user[data-u="D"]{background:#a855f7}
#records-list .rec-row .seq{
  color:var(--accent);font-weight:600;flex-shrink:0;min-width:32px;
}
#records-list .rec-row .region{
  color:var(--muted);font-size:12px;flex-shrink:0;
}
#records-list .rec-row .time{
  color:var(--muted);font-size:12px;flex:1;
}
#records-list .rec-row .amount{
  color:var(--yellow);font-weight:600;flex-shrink:0;
}
#records-list .rec-row .del{
  color:#c0392b;font-size:12px;flex-shrink:0;
  padding:4px 8px;border-radius:6px;background:rgba(192,57,43,0.15);
  cursor:pointer;
}
#records-list .empty{
  text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;
}

nav.tabbar{
  flex-shrink:0;display:flex;background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
}
nav.tabbar button{
  flex:1;background:transparent;border-radius:0;
  padding:14px 4px;font-size:13px;color:var(--muted);
  min-height:56px;font-weight:500;
}
nav.tabbar button.active{color:var(--accent)}

.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th{
  background:var(--card2);padding:12px 8px;text-align:left;
  font-weight:600;position:sticky;top:0;z-index:1;
  border-bottom:1px solid var(--border);
  font-size:14px;
}
.data-table td{
  padding:10px 8px;border-bottom:1px solid var(--border);
  word-break:break-all;line-height:1.4;
}
.data-table tr:last-child td{border-bottom:none}

.setting-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;padding:6px 0;
}
.setting-row label{flex:1;font-size:15px;line-height:1.3}
.setting-row input{
  width:110px !important;flex-shrink:0;text-align:center;
  min-height:48px;font-size:16px;
}
.setting-row .unit{color:var(--muted);font-size:14px;width:26px;text-align:center}

#loading{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading .spinner{
  width:44px;height:44px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{color:var(--muted);font-size:15px;text-align:center;padding:0 24px;line-height:1.6}

.subtab-bar{display:flex;gap:6px;flex-shrink:0}
.subtab-bar button{
  padding:12px 4px;font-size:14px;min-height:46px;
}
.subtab-bar button.active{background:var(--accent)}
.subtab-content{
  flex:1;min-height:0;overflow:auto;background:var(--card);
  border-radius:10px;
}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}

#year-select{
  background:var(--btn);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-size:13px;min-height:36px;
}

.risk-summary {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; margin-bottom: 10px;
  background: linear-gradient(135deg, #2a1f22 0%, #1f1a1c 100%);
  border-radius: 10px; font-size: 13px; font-weight: 600;
}
.risk-summary span {
  padding: 4px 10px; background: var(--card); border-radius: 6px;
}
.risk-summary .max { color: #f26666; }
.risk-summary .min { color: #59d97a; }
.risk-summary .avg { color: #3b8cf5; }

.table-wrap {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.table-wrap table.data-table { min-width: 820px; }

tr.risk-high    td:last-child { color: #f26666; font-weight: bold; }
tr.risk-mid     td:last-child { color: #ffd158; font-weight: bold; }
tr.risk-low     td:last-child { color: #59d97a; font-weight: bold; }
tr.risk-unknown td:last-child { color: var(--muted); }

.profit-pos { color: #f26666; font-weight: bold; }
.profit-neg { color: #59d97a; font-weight: bold; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="msg" id="loading-msg">正在启动…</div>
</div>

<header>
  <h1>押注统计</h1>
  <span id="status">初始化中…</span>
</header>

<main>
  <section class="tab active" id="tab-input">
    <div class="user-bar">
      <span>当前用户：</span>
      <button data-user="A" onclick="switchUser('A')">A</button>
      <button data-user="B" onclick="switchUser('B')">B</button>
      <button data-user="C" onclick="switchUser('C')">C</button>
      <button data-user="D" onclick="switchUser('D')">D</button>
    </div>

    <textarea id="raw-input" placeholder="粘贴下注内容…
例：龙鸡二连肖200 / 猴30米 / 鸡狗鼠各肖10"></textarea>
    <div id="ai-status">🤖 AI智能解析：本地失败后自动兜底，也可点“AI解析”手动触发</div>
    <div id="preview-box">（等待输入）</div>
    <div class="btn-row">
      <button onclick="onPaste()">粘贴</button>
      <button class="primary" onclick="onAdd()">添加</button>
      <button onclick="doPreview(true)">🤖 AI解析</button>
      <button onclick="onCopy()">复制</button>
      <button class="danger" onclick="onClearInput()">清空</button>
    </div>
    <div id="totals"></div>

    <div class="records-header">
      <h3>已添加记录</h3>
      <span class="count" id="records-count">0</span>
    </div>
    <div id="records-list">
      <div class="empty">还没有记录</div>
    </div>
  </section>

  <section class="tab" id="tab-summary">
    <div class="subtab-bar">
      <button data-subtab="numbers" class="active" onclick="switchSubtab('numbers')">号码</button>
      <button data-subtab="zodiac" onclick="switchSubtab('zodiac')">生肖</button>
      <button data-subtab="plays" onclick="switchSubtab('plays')">玩法</button>
    </div>
    <div class="subtab-content" id="summary-content"></div>
    <div class="btn-row">
      <button class="danger" onclick="onClearAll()">清空全部记录</button>
    </div>
  </section>

  <section class="tab" id="tab-win">
    <input type="text" id="macau-draw" placeholder="澳门开奖号码（7 个）">
    <input type="text" id="hk-draw" placeholder="香港开奖号码（7 个）">
    <div class="user-bar">
      <span>筛选用户：</span>
      <button data-winfilter="全部" onclick="switchWinFilter('全部')">全部</button>
      <button data-winfilter="A" onclick="switchWinFilter('A')">A</button>
      <button data-winfilter="B" onclick="switchWinFilter('B')">B</button>
      <button data-winfilter="C" onclick="switchWinFilter('C')">C</button>
      <button data-winfilter="D" onclick="switchWinFilter('D')">D</button>
    </div>
    <div class="btn-row">
      <button onclick="onRefreshWin()">刷新中奖</button>
      <button class="primary" onclick="onExport()">导出 Excel</button>
    </div>
    <div class="subtab-content" id="win-content"></div>
  </section>

  <section class="tab" id="tab-risk">
    <div class="subtab-content" id="risk-content"></div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="subtab-bar">
      <button data-settings-tab="odds" class="active" onclick="switchSettingsTab('odds')">赔率</button>
      <button data-settings-tab="rebate" onclick="switchSettingsTab('rebate')">回水</button>
    </div>
    <div id="settings-content" style="flex:1;overflow:auto"></div>
    <div class="btn-row">
      <button onclick="onResetSettings()">恢复默认</button>
      <button class="primary" onclick="onSaveSettings()">保存设置</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="input" class="active" onclick="switchTab('input')">输入</button>
  <button data-tab="summary" onclick="switchTab('summary')">汇总</button>
  <button data-tab="win" onclick="switchTab('win')">中奖</button>
  <button data-tab="risk" onclick="switchTab('risk')">风险</button>
  <button data-tab="settings" onclick="switchTab('settings')">设置</button>
</nav>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
